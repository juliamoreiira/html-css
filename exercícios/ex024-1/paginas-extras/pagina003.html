<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina 003</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgba(245, 245, 220, 0.299);
        }

        h1{
            color: white;
            margin-bottom: 0px;
        }
        
        p{
            margin-top: 5px;
            color: rgb(198, 192, 192);
        }

        h1,p{
            padding-left: 120px;
            text-align: left;
        }

        img{
            width: 110px;
            height: 110px;
            padding-right: 10px;
            border-radius: 20px;
        }

        img.icone{
            width: 80px;
            height: 80px;
        }
        div.linha{
            position: absolute;
            left: 0px;
            top: 125px;

        }

        hr{
            border: 0px;
            width: 560px;
            height: 3px;
            background-color: white;
        }

        #container{
            box-shadow: 1px 1px 10px rgba(0, 0, 0, 0.336);
            width: 500px;
            border-radius: 20px;
            padding: 30px;
            background-color: grey;
            margin: auto;
            position: relative;
        }

        #conteudo{
            position: absolute;
            left: 50px;
            top: 45px;
        }

        .conteudo2{
            position: absolute;
            left: 510px;
            top: 10px;

        }

        img.logo{
            width: 40px;
            height: 40px;
        }

        .conteudo03{
            position: absolute;
            left: 430px;
            top: 45px;
        }

        img.play{
            width: 70px;
            height: 70px;
        }

    

    </style>
</head>
<body>
    <div id="container">
        <div id="conteudo"><img src="../imagens/Red_Hot_Chili_Peppers_-_Californication.jpg" alt="" class="icone"></div>
        <h1>Californication</h1>
        <p>Red Hot Chilli Peppers</p>
        <br>
        <div class="linha">
            <hr>
        </div>
        <div class="conteudo2">
            <img src="../imagens/spotify.png" alt="" class="logo">
        </div>
        <div class="conteudo03">
            <img src="../imagens/play.png" alt="" class="play">
        </div>
        <img src="../imagens/galinhapintadinha.jpg" alt="">
        <img src="../imagens/logo_red_hot_chilli_peppers.jpg" alt="">
        <img src="../imagens/mamonas.jpg" alt="">
        <img src="../imagens/miku.jpg" alt="">
    </div>
    
</body>
</html>
