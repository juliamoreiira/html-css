<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 500px;
            border-collapse: collapse;
        }

        td,th{
            border: 1px solid black;
            padding: 8px;
        }

        .destaque{
            background-color: greenyellow;
        
        }

        col.cidade{
            background-color: pink;
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabelas</h1>

    <table>

        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprofissao">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col" class="destaque">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td class="destaque">Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td class="destaque">Márcia</td>
            <td>F</td>
            <td>27</td>
            <td>Vendedora</td>
        </tr>
        <tr>
            <td class="destaque">Cláudio</td>
            <td>M</td>
            <td>42</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td class="destaque">Hélio</td>
            <td>M</td>
            <td>28</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td class="destaque">Maria</td>
            <td>F</td>
            <td>34</td>
            <td>Médica</td>
        </tr>
        <tr>
            <td class="destaque">Otávio</td>
            <td>M</td>
            <td>29</td>
            <td>Nutricionista</td>
        </tr>

    </table>
</body>
</html>
